[project]
name = "app-store-suite"
version = "0.1.0"
description = "Store-asset automation: framed screenshots, app icons, store listing copy, and Play Store feature graphics for Flutter apps"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "Flask>=3.0",
    "fonttools>=4.0",
    "CairoSVG>=2.7",
]

[project.scripts]
appstoresuite = "app_store_suite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app_store_suite*"]

[tool.setuptools.package-data]
app_store_suite = ["fonts/*.ttf", "fonts/OFL.txt", "webui_static/*.html"]
