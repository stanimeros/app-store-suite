<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screenshot Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e3e3e0;
    --text: #1a1a1a;
    --muted: #78766f;
    --accent: #1f7a5c;
    --accent-text: #ffffff;
    --warn: #9a6b0c;
    --danger: #b3432b;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --panel: #202226;
      --border: #33353a;
      --text: #f0f0ee;
      --muted: #9a9ca3;
      --accent: #38a883;
      --accent-text: #0c1210;
      --warn: #e0b039;
      --danger: #e0715a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 12px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  h1 { font-size: 18px; margin: 0 0 2px; font-weight: 700; letter-spacing: -0.01em; }
  .tagline { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .devices { display: flex; gap: 8px; flex-wrap: wrap; }
  .device-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    line-height: 1.4;
    transition: background 0.15s, border-color 0.15s;
  }
  .device-btn .identifier { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
  .device-btn .progress { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 2px; }
  .device-btn:hover:not(:disabled) { border-color: var(--accent); }
  .device-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .device-btn.active .identifier, .device-btn.active .progress { color: var(--accent-text); opacity: 0.85; }
  .device-btn:disabled { opacity: 0.5; cursor: default; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .badge.busy { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); border-color: transparent; }
  .badge.ready { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); border-color: transparent; }
  .badge.error { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); border-color: transparent; }
  .status-text { font-size: 13px; color: var(--muted); }

  .capture-bar {
    display: flex;
    gap: 8px;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .capture-bar input {
    flex: 1;
    max-width: 320px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .capture-bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.capture-btn {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.capture-btn:disabled { opacity: 0.4; cursor: default; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 100px; overflow-x: auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 10px; }
  table.matrix { border-collapse: collapse; width: 100%; }
  table.matrix th, table.matrix td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    vertical-align: top;
  }
  table.matrix th {
    background: var(--panel);
    text-align: left;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  table.matrix th.active-col { color: var(--accent); }
  .shot-cell { min-width: 200px; }
  .shot-title { font-weight: 600; font-size: 14px; }
  .shot-subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .shot-id { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .row-actions { display: flex; gap: 12px; margin-top: 6px; }
  .row-capture-btn {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .row-capture-btn:hover:not(:disabled) { text-decoration: underline; }
  .row-capture-btn:disabled { color: var(--muted); cursor: default; }
  .remove-btn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }
  .remove-btn:hover { color: var(--danger); text-decoration: underline; }

  .cell-thumb {
    width: 72px;
    height: 148px;
    border-radius: 6px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--muted);
    font-size: 10px;
    text-align: center;
    border: 1px dashed var(--border);
  }
  .cell-thumb.captured { border-style: solid; }
  .cell-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn, .capture-btn, .row-capture-btn, .remove-btn { display: inline-flex; align-items: center; gap: 6px; }
  .icon { width: 14px; height: 14px; flex-shrink: 0; }
</style>
</head>
<body>
  <header>
    <h1 id="app-title">Screenshot Studio</h1>
    <p class="tagline">Pick a device, capture a screen, and Claude writes the title for you.</p>
    <div class="devices" id="devices"></div>
  </header>
  <div class="status-row">
    <span class="badge" id="status-badge">Idle</span>
    <span class="status-text" id="status-text">Loading…</span>
  </div>
  <div class="capture-bar">
    <input id="shot-name-input" type="text" placeholder="Name this screen, e.g. home, itinerary, map…" />
    <button class="capture-btn" id="capture-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      <span id="capture-btn-label">Capture</span>
    </button>
  </div>
  <main>
    <h2>Captured shots</h2>
    <table class="matrix" id="matrix" style="display:none">
      <thead><tr id="matrix-head"><th>Feature</th></tr></thead>
      <tbody id="matrix-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state">Nothing captured yet — select a device above, name a screen, and hit Capture.</div>
  </main>
  <footer>
    <button class="btn" id="quit-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      Quit &amp; Close Devices
    </button>
    <button class="btn primary" id="compose-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      Compose Store Images
    </button>
  </footer>

<script>
const ICON_CAMERA = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>';
const ICON_TRASH = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';

let lastStateJson = null;
let builtDeviceCols = false;
let currentState = null;
const deviceEls = new Map();       // key -> {btn, progressEl}
const deviceOrder = [];            // device keys, in table column order
const rowEls = new Map();          // shotId -> {tr, titleEl, subtitleEl, cells: Map(deviceKey -> {td, img})}

async function fetchState() {
  const res = await fetch('/api/state');
  const state = await res.json();
  const json = JSON.stringify(state);
  if (json === lastStateJson) return;
  lastStateJson = json;
  if (!builtDeviceCols) {
    buildDevices(state);
    builtDeviceCols = true;
  }
  patch(state);
}

function buildDevices(state) {
  document.title = `Screenshot Studio — ${state.app_name}`;
  document.getElementById('app-title').textContent = `Screenshot Studio — ${state.app_name}`;

  const devicesEl = document.getElementById('devices');
  const head = document.getElementById('matrix-head');
  for (const d of state.devices) {
    const btn = document.createElement('button');
    btn.className = 'device-btn';
    const identifierEl = document.createElement('span');
    identifierEl.className = 'identifier';
    identifierEl.textContent = d.identifier;
    const progressEl = document.createElement('span');
    progressEl.className = 'progress';
    btn.append(d.key, identifierEl, progressEl);
    btn.onclick = () => selectDevice(d.key);
    devicesEl.appendChild(btn);
    deviceEls.set(d.key, {btn, progressEl});

    const th = document.createElement('th');
    th.textContent = d.key;
    th.id = `col-${d.key}`;
    head.appendChild(th);
    deviceOrder.push(d.key);
  }
}

function ensureRow(shotId) {
  if (rowEls.has(shotId)) return rowEls.get(shotId);
  const tr = document.createElement('tr');

  const shotTd = document.createElement('td');
  shotTd.className = 'shot-cell';
  const titleEl = document.createElement('div');
  titleEl.className = 'shot-title';
  const subtitleEl = document.createElement('div');
  subtitleEl.className = 'shot-subtitle';
  const idEl = document.createElement('div');
  idEl.className = 'shot-id';
  idEl.textContent = `id: ${shotId}`;

  const actionsEl = document.createElement('div');
  actionsEl.className = 'row-actions';
  const captureEl = document.createElement('button');
  captureEl.className = 'row-capture-btn';
  captureEl.innerHTML = `${ICON_CAMERA}<span class="label">Capture here</span>`;
  captureEl.onclick = () => captureExisting(shotId);
  const removeEl = document.createElement('button');
  removeEl.className = 'remove-btn';
  removeEl.innerHTML = `${ICON_TRASH}Remove`;
  removeEl.onclick = () => deleteShot(shotId);
  actionsEl.append(captureEl, removeEl);

  shotTd.append(titleEl, subtitleEl, idEl, actionsEl);
  tr.appendChild(shotTd);

  const cells = new Map();
  for (const key of deviceOrder) {
    const td = document.createElement('td');
    const thumb = document.createElement('div');
    thumb.className = 'cell-thumb';
    thumb.textContent = 'not yet';
    td.appendChild(thumb);
    tr.appendChild(td);
    cells.set(key, {td, thumb, img: null, captured: false});
  }

  document.getElementById('matrix-body').appendChild(tr);
  const row = {tr, titleEl, subtitleEl, captureBtn: captureEl, cells};
  rowEls.set(shotId, row);
  return row;
}

function patch(state) {
  currentState = state;
  const currentIds = new Set(state.shots.map((s) => s.id));
  for (const [id, row] of rowEls) {
    if (!currentIds.has(id)) {
      row.tr.remove();
      rowEls.delete(id);
    }
  }

  const badge = document.getElementById('status-badge');
  const statusText = document.getElementById('status-text');
  statusText.textContent = state.error || state.status;
  badge.classList.remove('busy', 'ready', 'error');
  if (state.error) {
    badge.textContent = 'Error';
    badge.classList.add('error');
  } else if (state.busy) {
    badge.textContent = 'Working';
    badge.classList.add('busy');
  } else if (state.active_device) {
    badge.textContent = 'Ready';
    badge.classList.add('ready');
  } else {
    badge.textContent = 'Idle';
  }

  for (const d of state.devices) {
    const {btn, progressEl} = deviceEls.get(d.key);
    btn.classList.toggle('active', d.key === state.active_device);
    btn.disabled = state.busy;
    const done = state.shots.filter((s) => s.captured[d.key]).length;
    const total = state.shots.length;
    progressEl.textContent = total ? `${done}/${total} shots captured` : 'no shots yet';
    const col = document.getElementById(`col-${d.key}`);
    if (col) col.classList.toggle('active-col', d.key === state.active_device);
  }

  document.getElementById('matrix').style.display = state.shots.length ? '' : 'none';
  document.getElementById('empty-state').style.display = state.shots.length ? 'none' : '';

  const canCapture = state.active_device && !state.busy;

  for (const shot of state.shots) {
    const row = ensureRow(shot.id);
    row.titleEl.textContent = shot.title || (shot.title_pending ? 'Asking Claude for a title…' : shot.id);
    row.subtitleEl.textContent = shot.subtitle || '';
    row.captureBtn.disabled = !canCapture;
    row.captureBtn.querySelector('.label').textContent = state.active_device
      ? `Capture here (${state.active_device})`
      : 'Capture here';

    for (const key of deviceOrder) {
      const cell = row.cells.get(key);
      const captured = !!shot.captured[key];
      if (captured !== cell.captured) {
        cell.captured = captured;
        cell.thumb.classList.toggle('captured', captured);
        if (captured) {
          cell.thumb.textContent = '';
          const img = document.createElement('img');
          img.src = `/api/raw/${key}/${shot.id}.png?t=${Date.now()}`;
          cell.thumb.appendChild(img);
          cell.img = img;
        } else {
          cell.thumb.textContent = 'not yet';
          cell.img = null;
        }
      }
    }
  }

  const input = document.getElementById('shot-name-input');
  const captureBtn = document.getElementById('capture-btn');
  captureBtn.disabled = !canCapture;
  document.getElementById('capture-btn-label').textContent = state.active_device
    ? `Capture on ${state.active_device}`
    : 'Capture';
  input.disabled = !canCapture;

  document.getElementById('compose-btn').disabled = state.busy;
}

async function deleteShot(shotId) {
  if (!confirm(`Remove captured shots for '${shotId}' on every device? This can't be undone.`)) return;
  await fetch('/api/delete-shot', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({shot_id: shotId}),
  });
  fetchState();
}

async function selectDevice(key) {
  await fetch('/api/select-device', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key}),
  });
  fetchState();
}

async function submitCapture(name) {
  const deviceKey = currentState && currentState.active_device;
  const res = await fetch('/api/capture', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({shot_name: name}),
  });
  if (!res.ok) {
    const body = await res.json();
    alert(body.error || 'Capture failed');
    return;
  }
  const body = await res.json();
  lastStateJson = null; // force fetchState to re-render even if booleans are unchanged
  await fetchState();
  if (deviceKey && body.shot_id) {
    const cell = rowEls.get(body.shot_id)?.cells.get(deviceKey);
    if (cell && cell.img) {
      cell.img.src = `/api/raw/${deviceKey}/${body.shot_id}.png?t=${Date.now()}`;
    }
  }
}

async function doCapture() {
  const input = document.getElementById('shot-name-input');
  const name = input.value.trim();
  if (!name) return;
  await submitCapture(name);
  input.value = '';
}

async function captureExisting(shotId) {
  await submitCapture(shotId);
}

document.getElementById('capture-btn').onclick = doCapture;
document.getElementById('shot-name-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doCapture();
});

document.getElementById('compose-btn').onclick = async () => {
  await fetch('/api/compose', {method: 'POST'});
  fetchState();
};

document.getElementById('quit-btn').onclick = async () => {
  await fetch('/api/quit', {method: 'POST'});
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;">Screenshot Studio stopped. You can close this tab.</div>';
};

fetchState();
setInterval(fetchState, 1200);
</script>
</body>
</html>
