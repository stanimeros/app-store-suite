app:
  name: Chronal
  flutter_dir: /Users/stanimeros/Developer/chronal
  icon_source: assets/icon/icon.png # must be >=1024x1024

# First language is the default (used when no --lang is given, and what the web UI
# starts on). Raw screenshots are shared across languages; titles/subtitles, composed
# store images, and the feature graphic are per-language under output/chronal/<lang>/.
languages:
  - el
  - en

devices:
  ios_phone:
    simulator: "iPhone 17 Pro"
  ios_tablet:
    simulator: "iPad Pro 13-inch (M5)"
  android_phone:
    avd: "Medium_Phone"
  android_tablet:
    avd: "Pixel_Tablet"

# No fixed shot list: capture whatever screens you want, naming each one as you
# go (e.g. "home", "itinerary", "map"). Titles are suggested automatically by
# the `claude` CLI from the actual screenshot content and stored in
# output/chronal/<lang>/titles.json, shared across all devices for the same shot id.

style:
  background_color: "#FAFAF8" # fallback if auto-sampling ever fails
  background_mode: "auto" # sample each screenshot's own chrome color instead of flat white
  title_color: "#1A1A1A"
  # Matches the app's actual GoogleFonts.sourceSerif4() / GoogleFonts.inter() usage.
  font_bold: "SourceSerif4-Bold.ttf"
  font_regular: "Inter-Regular.ttf"
