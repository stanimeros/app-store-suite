app:
  name: Chronal
  flutter_dir: /Users/stanimeros/Developer/chronal
  bundle_id_ios: com.stanimeros.chronal
  package_id_android: com.stanimeros.chronal
  icon_source: assets/icon/icon.png # must be >=1024x1024

devices:
  ios_phone:
    simulator: "iPhone 17 Pro"
  ios_tablet:
    simulator: "iPad Pro 13-inch (M5)"
  android_phone:
    avd: "Medium_Phone"
  android_tablet:
    avd: "Pixel_Tablet"

shots:
  - id: home
    title: "Plan every trip in one place"
  - id: itinerary
    title: "Your itinerary, day by day"
  - id: map
    title: "See it all on the map"
  - id: places
    title: "Discover places to go"
  - id: budget
    title: "Keep your budget on track"
  - id: packing
    title: "Never forget what to pack"

style:
  background_color: "#FAFAF8"
  title_color: "#1A1A1A"
  font_bold: "Poppins-Bold.ttf"
  font_regular: "Poppins-Regular.ttf"
