# Starter license policy, generated by `appstoresuite init`.
# dev_dependencies (see pubspec_additions.yaml):
#   license_checker: ^1.6.2
#   dependency_validator: ^5.0.6
#
# Run: dart run license_checker check-licenses -c license_checker.yaml

permittedLicenses:
  # Goal: only free licenses with no obligations on us. We never modify
  # third-party package source (plug-and-play deps only), so weak-copyleft
  # licenses whose only obligation triggers on modification — MPL-2.0
  # (share modified files) and SIL OFL 1.1 (rename a modified font) —
  # are effectively obligation-free for us and safe to permit.
  - MIT
  - MIT-Modern-Variant
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - SIL OFL 1.1
  - MPL-2.0
  - Zlib

rejectedLicenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - LGPL-2.0
  - LGPL-2.1
  - LGPL-3.0
  - SSPL
  - CC-BY-SA-4.0

approvedPackages:
  no-file:
    - flutter_localizations
    - flutter_test
    - flutter_web_plugins
  unknown-license:
    - dependency_validator
