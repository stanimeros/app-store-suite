# Generated by `appstoresuite init`. appstoresuite never edits your pubspec.yaml
# directly (too easy to corrupt an existing dependency tree) — merge these entries
# into it by hand, then `flutter pub get`.
#
# firebase_core is required by both firebase_crashlytics and firebase_analytics; if
# your app isn't on Firebase yet, run `flutterfire configure` first.

dependencies:
  firebase_core: ^3.0.0
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.0.0

dev_dependencies:
  dependency_validator: ^5.0.6
  license_checker: ^1.6.2

# Crashlytics wiring (not automatable — do this once by hand, right after
# Firebase.initializeApp() in whatever function actually calls it):
#
#   FlutterError.onError = FirebaseCrashlytics.instance.recordFlutterFatalError;
#   PlatformDispatcher.instance.onError = (error, stack) {
#     FirebaseCrashlytics.instance.recordError(error, stack, fatal: true);
#     return true;
#   };
#
# Then in Xcode, add the "Upload Symbols to Crashlytics" build phase (see the
# firebase_crashlytics package docs) so iOS crash reports get symbolicated.
#
# Analytics: call FirebaseAnalytics.instance from wherever you want an event
# logged — no global wiring needed beyond adding the dependency.
#
# Run `appstoresuite validate` for store-listing copy checks; run
# `dart run dependency_validator` and `dart run license_checker check-licenses
# -c license_checker.yaml` (or `fastlane validate_deps`, wired up in the
# generated Fastfile) for dependency hygiene and license compliance.
