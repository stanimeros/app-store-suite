# Copy this file into your Flutter app's own repo root (e.g. as
# `app_store_suite.yaml`, alongside pubspec.yaml/l10n.yaml) and fill it in for
# your app. Run appstoresuite commands with --config pointing at wherever you
# put it — app-store-suite itself doesn't hold any per-app config.

app:
  name: YourApp
  flutter_dir: . # relative to this file; "." if the config sits at the repo root
  icon_source: assets/icon/icon.png # must be >=1024x1024, relative to flutter_dir

  # Required only for `auto-capture` (unattended, deep-link-driven capture).
  # Omit both this and shots: below to use manual capture-adjacent tooling instead
  # (compose/style-preview/etc. still work fine without them).
  # deep_link_scheme: yourapp # yourapp://<route> — must be registered by the app
  # (iOS: CFBundleURLSchemes in Info.plist; Android: an <intent-filter> with
  # android:scheme="yourapp" on the launcher activity), and handled by a debug
  # router that lands on the target screen with sample/mock data already loaded
  # (no login, no live network calls). See README's "Auto-capture requirements".

  # Required only for `fetch-listing` (pulling the currently-live listing copy
  # from App Store Connect / Play Console). Reuse whatever credentials your own
  # Fastfile already uses for shipping — same key files, same IDs. Paths below
  # are relative to flutter_dir.
  # bundle_id: com.yourcompany.yourapp
  # asc_key_id: XXXXXXXXXX
  # asc_issuer_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  # asc_key_path: keys/AuthKey_XXXXXXXXXX.p8
  # android_package_name: com.yourcompany.yourapp
  # play_json_key: keys/your-service-account.json

languages:
  - en # first language is the default

# App Store Connect / Play Console locale codes, if they differ from the codes
# above (e.g. "en" here vs "en-US" on the stores). Unmapped languages are tried
# as-is first, then a few common variants.
# store_locales:
#   en: en-US

devices:
  ios_phone:
    simulator: "iPhone 17 Pro" # any name from `xcrun simctl list devices available`
  android_phone:
    avd: "Medium_Phone" # any AVD name; `appstoresuite setup` creates missing ones

# shots:
#   - id: home
#     route: shot/home
#   - id: pricing
#     route: shot/pricing

style:
  background_color: "#FAFAF8"
  background_mode: "solid" # solid | auto | gradient
  title_color: "#1A1A1A"
  font_bold: "Poppins-Bold.ttf"
  font_regular: "Poppins-Regular.ttf"
  layout: "centered" # centered | tilted
  decoration: "none" # none | shapes | svg
